name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: verifiedpropertieske_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database only; the app itself is built without any database.
      DATABASE_URL_UNPOOLED: postgres://ci:ci@localhost:5432/verifiedpropertieske_test
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/verifiedpropertieske_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Migrations apply cleanly
        run: npm run db:migrate
      - name: Schema and committed migrations agree
        run: |
          npm run db:generate
          git diff --exit-code drizzle/
          test -z "$(git status --porcelain drizzle/)"
      - run: npm test
      - run: npm run build
